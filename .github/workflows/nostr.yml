name: Nostr Master Bot
on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - run: python master_bot.py
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
      - name: Guardar Estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update bot state"
          file_pattern: 'state.json'
